Title: "<gradient:#FDE68A:#F59E0B><bold>云称号</bold></gradient> <dark_gray>·</dark_gray> <white>商城"
Options:
  Click-Cooldown-Millis: 300
Layout:
  - "#########"
  - "#TTTTTTT#"
  - "#TTTTTTT#"
  - "#TTTTTTT#"
  - "#P###B#N#"
  - "#########"

Icons:
  '#':
    Display:
      Material: BROWN_STAINED_GLASS_PANE
      Name: " "
  'T':
    Type: title
    Display:
      Material: "%title_material%"
      Name: "<gradient:#FEF3C7:#FBBF24><bold>✦</bold></gradient> %title_name%"
      Lore:
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
        - "<gray>称号故事"
        - "<dark_gray>  ▪</dark_gray> <white>%title_description%"
        - ""
        - "<gray>原版增益 <dark_gray>│</dark_gray> <aqua>%title_buffs%"
        - "<gray>属性加成"
        - "<dark_gray>  ▪</dark_gray> %title_attributes%"
        - "<gray>获取方式 <dark_gray>│</dark_gray> %title_requirement%"
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
        - "<yellow>▶ 点击购买或领取"
    Actions:
      all:
        - "title: buy"
  'P':
    Display:
      Material: SPECTRAL_ARROW
      Name: "<yellow><bold>← 上一页</bold>"
      Lore: ["<gray>第 <white>%page%</white>/<white>%max_page%</white> 页"]
    Actions:
      all: ["menu: previous"]
  'N':
    Display:
      Material: SPECTRAL_ARROW
      Name: "<yellow><bold>下一页 →</bold>"
      Lore: ["<gray>第 <white>%page%</white>/<white>%max_page%</white> 页"]
    Actions:
      all: ["menu: next"]
  'B':
    Display:
      Material: CHEST
      Name: "<aqua><bold>返回称号仓库</bold>"
      Lore:
        - "<gray>查看并佩戴已经拥有的称号"
        - ""
        - "<aqua>▶ 点击返回"
    Actions:
      all: ["menu: warehouse"]
