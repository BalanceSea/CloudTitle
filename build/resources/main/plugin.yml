name: CloudTitle
version: '1.0-SNAPSHOT'
main: github.balncesea.cloudTitle.CloudTitle
api-version: '1.21.11'
load: POSTWORLD
prefix: 云称号
authors: [MoutainSeaL]
description: 支持数据库、GUI、商城、自定义称号与药水 Buff 的称号插件

# 由 Spigot/Paper LibraryLoader 从 Maven Central 加载，不打包进插件 JAR。
libraries:
  - com.zaxxer:HikariCP:6.3.0
  - org.xerial:sqlite-jdbc:3.50.3.0
  - com.mysql:mysql-connector-j:9.4.0

softdepend: [Vault, PlaceholderAPI, PlayerPoints, CraftEngine]
commands:
  cloudtitle:
    description: 云称号主命令
    usage: /cloudtitle
    aliases: [ct, title, 称号]
permissions:
  cloudtitle.use: {default: true}
  cloudtitle.admin: {default: op}
  cloudtitle.custom: {default: true}
  cloudtitle.custom.bypass: {default: op}
