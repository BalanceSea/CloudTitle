# CloudTitle common messages. GUI text remains in gui/*.yml and is not localized here.
prefix: "<dark_gray>[<aqua>CloudTitle</aqua>]</dark_gray> "
no-permission: "<red>You do not have permission to do that."
player-only: "<red>This command can only be used by a player."
loading: "<yellow>Your title data is still loading. Please wait."
storage-error: "<red>Title storage failed. Please contact an administrator."
title-equipped: "<green>Equipped title: %title%"
title-cleared: "<green>Your current title has been cleared."
title-obtained: "<green>Title obtained: %title%"
title-owned: "<yellow>You already own this title."
title-not-owned: "<red>You do not own this title."
title-not-found: "<red>Title not found: %id%"
insufficient-money: "<red>You need %amount% more coins."
insufficient-points: "<red>You need %amount% more points."
economy-unavailable: "<red>The required economy service is unavailable."
requirement-missing: "<red>You do not meet this title's permission requirement."
papi-unavailable: "<red>PlaceholderAPI is unavailable, so this condition cannot be checked."
papi-config-error: "<red>This title has no valid PAPI conditions. Contact an administrator."
papi-requirement-missing: "<red>Your placeholder values do not meet the requirement."
purchase-failed: "<red>Purchase failed. No balance was charged."
item-config-error: "<red>This title has no valid item requirements. Contact an administrator."
item-submit-processing: "<yellow>Your previous item submission is still processing."
item-submit-empty: "<yellow>No required items were found. Progress: %progress%"
item-submit-progress: "<green>Submitted %submitted% items.</green> <gray>Progress: %progress%"
craftengine-unavailable: "<red>CraftEngine is required for this item title but is unavailable."
custom-disabled: "<red>Custom titles are disabled."
custom-input-name: "<yellow>Type a title name in chat. Legacy colors such as &a or &#55FFFF are supported; type cancel to stop."
custom-input-description: "<yellow>Type a title description in chat, or type cancel to stop."
custom-input-cancelled: "<gray>Input cancelled."
custom-name-required: "<red>Set a title name first."
custom-invalid-length: "<red>Input length must be between 1 and %max% characters."
custom-created: "<green>Custom title created and added to your warehouse."
custom-failed: "<red>Could not create the custom title."
reload-success: "<green>Configuration and title definitions reloaded."
command-help:
  - "<aqua>/cloudtitle</aqua> <gray>- Open your title warehouse"
  - "<aqua>/cloudtitle menu</aqua> <gray>- Open a title menu"
  - "<aqua>/cloudtitle shop</aqua> <gray>- Open the title shop"
  - "<aqua>/cloudtitle custom</aqua> <gray>- Open the custom title workshop"
  - "<aqua>/cloudtitle set <id></aqua> <gray>- Equip a title"
  - "<aqua>/cloudtitle clear</aqua> <gray>- Clear the equipped title"
  - "<aqua>/cloudtitle add/remove <player> <id></aqua> <gray>- Manage titles"
  - "<aqua>/cloudtitle reload</aqua> <gray>- Reload configuration"
admin-success: "<green>Operation succeeded: %player% / %id%"
admin-failed: "<red>Operation failed. Check the title ID and server log."

buff-display:
  none: "<gray>No buffs</gray>"
  format: "<aqua>%effect%</aqua> <white>%level%</white>"
  separator: "<dark_gray>, </dark_gray>"
attribute-display:
  none: "<gray>No attribute bonuses</gray>"
  attribute-plus-name: "<gold><bold>AP</bold></gold>"
  sx-attribute-name: "<aqua><bold>SX</bold></aqua>"
  provider-format: "%provider% <dark_gray>|</dark_gray> %attributes%"
  provider-separator: "<dark_gray>; </dark_gray>"
  entry-format: "<white>%attribute%</white>"
  entry-separator: "<dark_gray>, </dark_gray>"
shop-requirements:
  money: "<gold><bold>Coins</bold></gold> <dark_gray>|</dark_gray> <white>%amount% coins</white>"
  points: "<aqua><bold>Points</bold></aqua> <dark_gray>|</dark_gray> <white>%amount% points</white>"
  permission: "<light_purple><bold>Permission</bold></light_purple> <dark_gray>|</dark_gray> <white>Required permission</white>"
  item: "<yellow><bold>Items</bold></yellow> <dark_gray>|</dark_gray> %items%"
  papi: "<blue><bold>Variable</bold></blue> <dark_gray>|</dark_gray> %papi_conditions%"
  free: "<green><bold>Free</bold></green>"

