# 配置版本；修改 GUI 后使用 /cloudtitle reload，存储类型等全局设置仍需重启。
config-version: 2
# TrMenu 风格字符布局：每行必须为 9 个字符，最多 6 行；修改后使用 /cloudtitle reload。
# Icons 可选 Conditions.Permission/Permissions 或 Placeholder、Operator、Value 节点。
# Options.Click-Cooldown-Millis 单位为毫秒，允许 0-5000，0 表示关闭限制。
Title: "<gradient:#67E8F9:#38BDF8><bold>云称号</bold></gradient> <dark_gray>·</dark_gray> <white>仓库"
Options:
  # 0 表示关闭限制，最大支持 5000 毫秒。
  Click-Cooldown-Millis: 300
Layout:
  - "#########"
  - "#TTTTTTT#"
  - "#TTTTTTT#"
  - "#TTTTTTT#"
  - "#P#SUC#N#"
  - "#########"

Icons:
  '#':
    Display:
      Material: BLACK_STAINED_GLASS_PANE
      Name: " "
  'T':
    Type: title
    Display:
      Material: "%title_material%"
      Name: "<gradient:#F8FAFC:#BAE6FD><bold>✦</bold></gradient> %title_name%"
      Lore:
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
        - "<gray>称号介绍"
        - "<dark_gray>  ▪</dark_gray> <white>%title_description%"
        - ""
        - "<gray>原版增益 <dark_gray>│</dark_gray> <aqua>%title_buffs%"
        - "<gray>属性加成"
        - "<dark_gray>  ▪</dark_gray> %title_attributes%"
        - "<gray>当前状态 <dark_gray>│</dark_gray> %title_status%"
        - "<dark_gray>━━━━━━━━━━━━━━━━━━━━"
        - "<yellow>▶ 点击佩戴此称号"
    Selected:
      Glow: true
      Lore-Append:
        - "<green>✔ 该称号正在展示"
    Actions:
      all:
        - "title: select"
  'P':
    Display:
      Material: SPECTRAL_ARROW
      Name: "<yellow><bold>← 上一页</bold>"
      Lore:
        - "<gray>当前页数：<white>%page%</white>/<white>%max_page%"
    Actions:
      all: ["menu: previous"]
  'N':
    Display:
      Material: SPECTRAL_ARROW
      Name: "<yellow><bold>下一页 →</bold>"
      Lore:
        - "<gray>当前页数：<white>%page%</white>/<white>%max_page%"
    Actions:
      all: ["menu: next"]
  'S':
    Display:
      Material: EMERALD
      Name: "<green><bold>称号商城</bold>"
      Lore:
        - "<gray>浏览金币、点券和权限称号"
        - ""
        - "<green>▶ 点击进入"
    Actions:
      all: ["menu: shop"]
  'U':
    Display:
      Material: RED_DYE
      Name: "<red><bold>卸下当前称号</bold>"
      Lore:
        - "<gray>保留拥有权，停止展示及全部加成"
        - ""
        - "<red>▶ 点击卸下"
    Actions:
      all: ["title: clear"]
  'C':
    Display:
      Material: NAME_TAG
      Name: "<aqua><bold>自定义称号</bold>"
      Lore:
        - "<gray>打造只属于你的个性称号"
        - "<gray>当前拥有：<white>%owned_count%</white> 个"
        - ""
        - "<aqua>▶ 点击设计"
    Actions:
      all: ["menu: custom"]
