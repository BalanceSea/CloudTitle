name: CloudTitle
version: '${version}'
main: github.balncesea.cloudTitle.CloudTitle
api-version: '1.20'
load: POSTWORLD
prefix: 云称号
authors: [MoutainSeaL]
description: 支持数据库、GUI、商城、自定义称号、药水 Buff 与 AP/SX 属性的称号插件

# 由 Spigot LibraryLoader 从 Maven Central 加载，不打包进插件 JAR。
libraries:
  - net.kyori:adventure-api:4.14.0
  - net.kyori:adventure-text-minimessage:4.14.0
  - net.kyori:adventure-text-serializer-legacy:4.14.0
  - net.kyori:adventure-text-serializer-plain:4.14.0
  - com.zaxxer:HikariCP:6.3.0
  - org.xerial:sqlite-jdbc:3.50.3.0
  - com.mysql:mysql-connector-j:9.4.0

softdepend: [Vault, PlaceholderAPI, PlayerPoints, CraftEngine, AttributePlus, SX-Attribute]
commands:
  cloudtitle:
    description: 云称号主命令
    usage: /cloudtitle
    aliases: [ct, title, 称号]
permissions:
  cloudtitle.use: {default: true}
  cloudtitle.admin: {default: op}
  cloudtitle.custom: {default: true}
  cloudtitle.custom.bypass: {default: op}
